name: Audio del giorno

on:
  schedule:
    - cron: "41 3 * * *"   # ogni notte verso le 4:40 (ora italiana d'inverno), dopo l'uscita del post
  workflow_dispatch:
    inputs:
      data:
        description: "Data AAAA-MM-GG (vuoto = oggi)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: audio-del-giorno
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Rome
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Programmi di sistema (sintesi italiana e MP3)
        run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg

      - name: Librerie Python
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Modello delle voci (in cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Crea l'audio
        run: python build.py --data "${{ github.event.inputs.data }}"

      - name: Pubblica l'MP3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(cat out/data.txt)
          if gh release view "$D" >/dev/null 2>&1; then
            gh release upload "$D" out/*.mp3 --clobber
          else
            gh release create "$D" out/*.mp3 --title "$(cat out/titolo.txt)" --notes-file out/note.md
          fi

      - name: Avvisa per mail se è stata usata la voce di riserva
        if: hashFiles('out/avviso.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Audio del $(cat out/data.txt) con la voce di riserva" --body-file out/avviso.md

      - name: Aggiorna la pagina e il feed
        run: |
          git config user.name "audio-del-giorno"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git commit -m "Audio del $(cat out/data.txt)" || echo "Niente da aggiornare"
          git pull --rebase
          git push

      - name: Avvisa per mail se l'audio non è stato creato
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "L'audio del giorno non è stato creato ($(date +%d/%m/%Y))" --body "Qualcosa non ha funzionato. Dettagli: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Se succede più giorni di fila, scrivilo a Claude."
