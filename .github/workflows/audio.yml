name: Audio del giorno

on:
  schedule:
    # il post esce verso le 00:10: primo tentativo alle 00:30 (ora italiana d'inverno), poi riprove
    # se GitHub ritarda o il post non c'è ancora; se l'audio del giorno c'è già, non fanno nulla
    - cron: "30 23 * * *"
    - cron: "30 0 * * *"
    - cron: "13 2 * * *"
    - cron: "41 3 * * *"
    - cron: "47 4 * * *"   # ultimo tentativo: se il post non c'è ancora, arriva la mail
  workflow_dispatch:
    inputs:
      data:
        description: "Data AAAA-MM-GG (vuoto = oggi)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: audio-del-giorno
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    outputs:
      fatto: ${{ steps.c.outputs.fatto }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Europe/Rome
        run: |
          D=$(date +%F)
          if { [ "${{ github.event_name }}" = "schedule" ] || [ -z "${{ github.event.inputs.data }}" ]; } && gh api "repos/$GITHUB_REPOSITORY/releases/tags/$D" >/dev/null 2>&1; then
            echo "L'audio di oggi ($D) c'è già"; echo "fatto=true" >> "$GITHUB_OUTPUT"
          else
            echo "fatto=false" >> "$GITHUB_OUTPUT"
          fi

  audio:
    needs: controlla
    if: needs.controlla.outputs.fatto != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Rome
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Programmi di sistema (sintesi italiana e MP3)
        run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg

      - name: Librerie Python
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Modello delle voci (in cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Crea l'audio
        id: build
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          set +e
          python build.py --data "${{ github.event.inputs.data }}"
          rc=$?
          if [ $rc -eq 3 ] && { [ "${{ github.event_name }}" = "schedule" ] || [ -z "${{ github.event.inputs.data }}" ]; } && [ "$(date +%H)" -lt 5 ]; then
            echo "Il post di oggi non è ancora uscito: ci riprova il prossimo avvio."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $rc

      - name: Pubblica l'MP3
        if: steps.build.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(cat out/data.txt)
          if gh release view "$D" >/dev/null 2>&1; then
            gh release upload "$D" out/*.mp3 --clobber
          else
            gh release create "$D" out/*.mp3 --title "$(cat out/titolo.txt)" --notes-file out/note.md
          fi

      - name: Avvisa per mail se è stata usata la voce di riserva
        if: steps.build.outputs.skip != 'true' && (hashFiles('out/avviso.md') != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Audio del $(cat out/data.txt) con la voce di riserva" --body-file out/avviso.md

      - name: Aggiorna la pagina e il feed
        if: steps.build.outputs.skip != 'true'
        run: |
          git config user.name "audio-del-giorno"
          git config user.email "actions@users.noreply.github.com"
          D=$(cat out/data.txt)
          mkdir -p /tmp/sito && cp docs/episodes.json /tmp/sito/ && cp "docs/posts/$D.json" /tmp/sito/post.json
          rm -rf /tmp/fisse && cp -r voci-fisse /tmp/fisse 2>/dev/null || true
          git checkout -- docs && git clean -fdq docs
          git checkout -- voci-fisse 2>/dev/null || true; git clean -fdq voci-fisse 2>/dev/null || true
          git pull --rebase origin main
          python ripubblica.py "$D" /tmp/sito
          python tools/unisci_fisse.py /tmp/fisse
          git add docs voci-fisse 2>/dev/null || git add docs
          git commit -m "Audio del $D" || echo "Niente da aggiornare"
          git push

      - name: Avvisa per mail se l'audio non è stato creato
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "L'audio del giorno non è stato creato ($(date +%d/%m/%Y))" --body "Qualcosa non ha funzionato. Dettagli: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Se succede più giorni di fila, scrivilo a Claude."
