name: Campioni voci

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  campioni:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1
      - run: python campioni.py
      - name: Pubblica i campioni
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete campioni-voci -y --cleanup-tag 2>/dev/null || true
          gh release create campioni-voci out/campioni/*.mp3 --title "Campioni di voci" --notes "Confronto delle voci italiane" --prerelease
