name: Novità voci Azure

# Ogni lunedì controlla se Azure ha nuove voci italiane: se sì, apre un avviso (arriva per mail)
# e rifà i campioni da ascoltare sul sito.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy requests
      - run: python tools/novita_voci.py
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      - name: Avviso e nuovi campioni
        if: hashFiles('out/nuove-voci.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voci-azure.txt && git commit -m "Elenco voci Azure aggiornato" && git pull --rebase -q && git push -q
          gh issue create --title "Novità nelle voci italiane di Azure" --body-file out/nuove-voci.md
          gh workflow run campioni-azure.yml
