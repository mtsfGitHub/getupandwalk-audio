name: Prova di una voce

# Rifà la preghiera di un giorno con un'altra voce e la mette tra le prove della pagina dei campioni,
# accanto alla versione ufficiale (che non viene toccata).
on:
  workflow_dispatch:
    inputs:
      data:
        description: "Giorno AAAA-MM-GG"
        required: true
      contenuti:
        description: "Voce femminile da provare (es. azure:it-IT-FabiolaNeural), vuoto = quella del modello"
        default: ""
      struttura:
        description: "Voce maschile da provare, vuoto = quella del modello"
        default: ""
      nome:
        description: "Nome della prova (es. Fabiola)"
        required: true
      nome_ufficiale:
        description: "Nome della versione ufficiale da mettere accanto (es. Isabella), vuoto = nessuna"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: audio-del-giorno
  cancel-in-progress: false

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Crea la prova
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python build.py --no-sito --data "${{ inputs.data }}" --contenuti "${{ inputs.contenuti }}" --struttura "${{ inputs.struttura }}"
      - name: Mettila tra le prove
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="${{ inputs.data }}"; G=$(date -d "$D" +%d)
          mkdir -p prove
          cp "out/getupandwalk-$D.mp3" "prove/prova-$G-${{ inputs.nome }}.mp3"
          if [ -n "${{ inputs.nome_ufficiale }}" ]; then
            gh release download "$D" -p "getupandwalk-$D.mp3" -O "prove/prova-$G-${{ inputs.nome_ufficiale }}.mp3" --clobber
          fi
          gh release upload campioni-azure prove/*.mp3 --clobber
          gh workflow run sito.yml
