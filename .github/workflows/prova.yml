name: Prova pronuncia

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install edge-tts==7.3.1 numpy scipy pyyaml requests beautifulsoup4 soundfile
      - run: python prova_pronuncia.py
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      - name: Mettila tra le prove
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload campioni-azure out/prova-*.mp3 --clobber
          gh workflow run sito.yml
