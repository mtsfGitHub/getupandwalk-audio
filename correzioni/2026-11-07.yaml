# Correzioni fatte a mano nel pannello, valgono solo per questo giorno
citazione_fonte_letta: Giovanni Pascoli, da X agosto
citazione: 'E tu, Cielo, dall’alto dei mondi

  sereni, infinito, immortale,

  oh, d’un pianto di stelle lo inondi

  quest’atomo opaco del Male!'
domande:
- Quali ricchezze nella mia vita annebbiano l’autenticità della relazione con il Signore?
- 'Faccio memoria delle mie amicizie: come mi hanno condotto alla casa di Dio?'
- Quando, qualcosa di poco conto mi ha aperto allo stupore del Creatore?
