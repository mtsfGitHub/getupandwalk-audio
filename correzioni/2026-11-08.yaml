# Correzioni fatte a mano nel pannello, valgono solo per questo giorno
citazione: "La fede è l’uccello che sente la luce \ne canta quando l’alba è ancora buia."
vangelo: 'In quel tempo, Gesù disse ai suoi discepoli questa parabola:


  «Il regno dei cieli sarà simile a dieci vergini che presero le loro lampade e uscirono incontro allo sposo. Cinque di esse erano stolte e cinque sagge; le stolte presero le loro lampade, ma non presero con sé l’olio; le sagge invece, insieme alle loro lampade, presero anche l’olio in piccoli vasi. Poiché lo sposo tardava, si assopirono tutte e si addormentarono.


  A mezzanotte si alzò un grido: “Ecco lo sposo! Andategli incontro!”. Allora tutte quelle vergini si destarono e prepararono le loro lampade. Le stolte dissero alle sagge: “Dateci un po’ del vostro olio, perché le nostre lampade si spengono”. Le sagge risposero: “No, perché non venga a mancare a noi e a voi; andate piuttosto dai venditori e compratevene”.


  Ora, mentre quelle andavano a comprare l’olio, arrivò lo sposo e le vergini che erano pronte entrarono con lui alle nozze, e la porta fu chiusa. Più tardi arrivarono anche le altre vergini e incominciarono a dire: “Signore, signore, aprici!”. Ma egli rispose: “In verità io vi dico, non vi conosco”.


  Vegliate dunque, perché non sapete né il giorno né l’ora».'
