# Correzioni fatte a mano nel pannello, valgono solo per questo giorno
citazione_fonte_letta: 'Jovanotti, da: La notte dei desideri.'
vangelo: "Si avvicinava la Pasqua dei Giudei e Gesù salì a Gerusalemme.\n\nTrovò nel tempio gente che vendeva buoi, pecore e colombe e, là seduti, i cambiamonete.\n\nAllora fece una frusta di cordicelle e scacciò tutti fuori del tempio, con le pecore e i buoi; gettò a terra il denaro dei cambiamonete e ne rovesciò i banchi, e ai venditori di colombe disse: «Portate via di qui queste cose e non fate della casa del Padre-mio un mercato!».\n\nI suoi discepoli si ricordarono che sta scritto: «Lo zelo per la tua casa mi divorerà». [pausa lunga] \n\nAllora i Giudei presero la parola e gli dissero: «Quale segno ci mostri per fare queste cose?». Rispose loro Gesù: «Distruggete questo tempio e in tre giorni lo farò risorgere».\n\nGli dissero allora i Giudei: «Questo tempio è stato costruito in quarantasei anni e tu in tre giorni lo farai risorgere?». Ma egli parlava del tempio del suo corpo.\n\nQuando poi fu risuscitato dai morti, i suoi discepoli si ricordarono che aveva detto questo, e credettero alla Scrittura e alla parola detta da Gesù."
commento: "Una presentazione dura, quella di Gesù che ci viene fatta oggi nel Vangelo. Non si tratta di un semplice scatto d’ira, un impeto emotivo, ma piuttosto sembrerebbe un’azione scrupolosa e preparata: potremmo contemplare l’immagine di Gesù che si siede a preparare la frusta di cordicelle, e pazientemente predispone il suo intervento dopo aver visitato il tempio, appena arrivato a Gerusalemme.\n\nI giudei chiedono spiegazioni e si aspettano un segno che possa dimostrare che ha davvero l’autorità di Dio per fare questo. \nGesù risponde [0,3] però [0,3] con l’annuncio della distruzione del tempio e la sua ricostruzione in tre giorni. Parla del proprio corpo, come esplicita l’evangelista e come comprenderanno i discepoli dopo la sua risurrezione: è lui il tempio vivo, il luogo della presenza di Dio. È un cambio di prospettiva importante: i giudei chiedono un segno per poter credere, mentre Gesù li invita a tenere fisso lo sguardo sulla sua persona e, soprattutto, sulla sua Pasqua.\n\nNon sempre comprendiamo immediatamente ciò che il Signore ci dice, e spesso facciamo fatica a cogliere pienamente come opera nella nostra vita; \ntuttavia, la fede non consiste nel pretendere che Dio ci dia immediatamente le prove che chiediamo, ma nell’imparare a riconoscere la sua presenza alla luce della Parola e della morte e risurrezione di Gesù.\n\nOggi allora siamo chiamati a questo passaggio: dalla ricerca di segni che rassicurano la nostra fede, alla disponibilità a riconoscere e accogliere sinceramente il Signore nella nostra vita. \nSi tratta di riconoscerlo là dove si manifesta: in Gesù, Parola fatta carne, che ha donato sé stesso per noi. \nSiamo così chiamati a riscoprire che anche noi siamo tempio vivo dello Spirito che abita in noi, e a portare la sua luce, la sua bellezza, il suo amore nella nostra quotidianità"
domande:
- Quali segni metto come condizione a Dio per potermi fidare di lui?
- Come posso riconoscere la presenza del Signore anche nella fatica di non comprendere pienamente ciò che accade nella mia vita?
- In che modo posso essere, oggi, nella mia vita, segno e strumento dell’amore di Dio?
