# Correzioni fatte a mano nel pannello, valgono solo per questo giorno
commento: "Una presentazione dura, quella di Gesù che ci viene fatta oggi nel Vangelo. Non si tratta di un semplice scatto d’ira, un impeto emotivo, ma piuttosto sembrerebbe un’azione scrupolosa e preparata: potremmo contemplare l’immagine di Gesù che si siede a preparare la frusta di cordicelle, e pazientemente predispone il suo intervento, dopo aver visitato il tempio, appena arrivato a Gerusalemme.\n\nI giudei chiedono spiegazioni e si aspettano un segno che possa dimostrare che ha davvero l’autorità di Dio per fare questo. \nGesù risponde però con l’annuncio della distruzione del tempio e la sua ricostruzione in tre giorni. \n\nParla del proprio corpo, come esplicita l’evangelista e come comprenderanno i discepoli dopo la sua risurrezione: è lui il tempio vivo, il luogo della presenza di Dio. È un cambio di prospettiva importante: i giudei chiedono un segno per poter credere, mentre Gesù li invita a tenere fisso lo sguardo sulla sua persona e, soprattutto, sulla sua Pasqua.\n\nNon sempre comprendiamo immediatamente ciò che il Signore ci dice, e spesso facciamo fatica a cogliere pienamente come opera nella nostra vita; \ntuttavia, la fede non consiste nel pretendere che Dio ci dia immediatamente le prove che chiediamo, ma nell’imparare a riconoscere la sua presenza alla luce della Parola, e della morte e risurrezione di Gesù.\n\nOggi allora siamo chiamati a questo passaggio: dalla ricerca di segni che rassicurano la nostra fede, alla disponibilità a riconoscere e accogliere sinceramente il Signore nella nostra vita. \nSi tratta di riconoscerlo là dove si manifesta: in Gesù, Parola fatta carne, che ha donato sé stesso per noi. \nSiamo così chiamati a riscoprire che anche noi siamo tempio vivo dello Spirito che abita in noi, e a portare la sua luce, la sua bellezza, il suo amore nella nostra quotidianità."
