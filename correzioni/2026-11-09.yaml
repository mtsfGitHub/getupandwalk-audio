# Correzioni fatte a mano nel pannello, valgono solo per questo giorno
citazione_fonte_letta: 'Jovanotti, da: La notte dei desideri.'
vangelo: "Si avvicinava la Pasqua dei Giudei e Gesù salì a Gerusalemme.\nTrovò nel tempio gente che vendeva buoi, pecore e colombe e, là seduti, i cambiamonete.\nAllora fece una frusta di cordicelle e scacciò tutti fuori del tempio, con le pecore e i buoi; gettò a terra il denaro dei cambiamonete e ne rovesciò i banchi, e ai venditori di colombe disse: «Portate via di qui queste cose e non fate della casa del Padremio un mercato!».\nI suoi discepoli si ricordarono che sta scritto: «Lo zelo per la tua casa mi divorerà».\nAllora i Giudei presero la parola e gli dissero: «Quale segno ci mostri per fare queste cose?». Rispose loro Gesù: «Distruggete questo tempio e in tre giorni lo farò risorgere».\nGli dissero allora i Giudei: «Questo tempio è stato costruito in quarantasei anni e tu in tre giorni lo farai risorgere?». Ma egli parlava del tempio del suo corpo.\nQuando poi fu risuscitato dai morti, i suoi discepoli si ricordarono che aveva detto questo, e credettero alla Scrittura e alla parola detta da Gesù."
commento: 'Una presentazione dura, quella di Gesù che ci viene fatta oggi nel Vangelo. Non si tratta di un semplice scatto d’ira, un impeto emotivo, ma piuttosto sembrerebbe un’azione scrupolosa e preparata: potremmo contemplare l’immagine di Gesù che si siede a preparare la frusta di cordicelle e pazientemente predispone il suo intervento dopo aver visitato il tempio, appena arrivato a Gerusalemme.

  I giudei chiedono spiegazioni e si aspettano un segno che possa dimostrare che ha davvero l’autorità di Dio per fare questo. Gesù risponde, però, con l’annuncio della distruzione del tempio e la sua ricostruzione in tre giorni. Parla del proprio corpo, come esplicita l’evangelista e come comprenderanno i discepoli dopo la sua risurrezione: è lui il tempio vivo, il luogo della presenza di Dio. È un cambio di prospettiva importante: i giudei chiedono un segno per poter credere, mentre Gesù li invita a tenere fisso lo sguardo sulla sua persona e, soprattutto, sulla sua Pasqua.

  Non sempre comprendiamo immediatamente ciò che il Signore ci dice e spesso facciamo fatica a cogliere pienamente come opera nella nostra vita; tuttavia, la fede non consiste nel pretendere che Dio ci dia immediatamente le prove che chiediamo, ma nell’imparare a riconoscere la sua presenza alla luce della Parola e della morte e risurrezione di Gesù.

  Oggi allora siamo chiamati a questo passaggio: dalla ricerca di segni che rassicurano la nostra fede, alla disponibilità a riconoscere e accogliere sinceramente il Signore nella nostra vita. Si tratta di riconoscerlo là dove si manifesta: in Gesù, Parola fatta carne, che ha donato sé stesso per noi. Siamo così chiamati a riscoprire che anche noi siamo tempio vivo dello Spirito che abita in noi e a portare la sua luce, la sua bellezza, il suo amore nella nostra quotidianità'
