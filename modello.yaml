# Il modello della preghiera audio di Get up and Walk.
# Si può modificare direttamente da GitHub (icona della matita): la mattina dopo l'audio segue il nuovo modello.
#
# Ogni sezione ha un elenco di elementi:
#   M: "testo"          → lo legge la voce della struttura (maschile, vedi "voci" qui sotto)
#   F: "testo"          → lo legge la voce dei contenuti (femminile)
#   velocita: 0.92      → (facoltativo, accanto a M o F) più lento di 1 = più lento
#   pausa: 10           → secondi di pausa, con la musica
#   musica: 8           → secondi di sola musica
#   per_ogni_domanda:   → ripete gli elementi indicati per ogni domanda del post
#
# Dentro i testi:
#   [pausa] = 2 secondi di silenzio, [pausa 4] = 4 secondi; andare a capo = piccola pausa.
#   Le parti tra graffe si riempiono ogni giorno dal post:
#   {giorno} {liturgia} {titolo} {autore} {evangelista} {vangelo} {commento}
#   {citazione} {citazione_fonte} {citazione_fonte_letta} {domanda} {mi_preparo_post} {immagino_post} {ringrazio_post}
#
# "se:" fa saltare la sezione quando quel giorno il post non ha quella parte
#   (citazione, vangelo, commento, domande).

voci:
  struttura: edge:it-IT-GiuseppeNeural   # voce maschile di Edge (titoli, annunci, frasi di raccordo); alternativa: edge:it-IT-DiegoNeural
  contenuti: edge:it-IT-IsabellaNeural   # voce femminile di Edge (citazione, Vangelo, commento, domande, preghiere); alternativa: edge:it-IT-ElsaNeural
  riserva: im_nicola                     # se le voci di Edge non rispondono: Nicola (Kokoro), e arriva una mail
  velocita: 1.0             # velocità generale

pause:
  a_capo: 1.2               # a ogni a capo e tra una battuta e l'altra
  due_punti: 0.6            # dopo i due punti

musica:
  volume: 0.6               # 0 = niente musica, 1 = piena
  sotto_la_voce: true       # musica bassa anche mentre la voce legge

scaletta:
  - sezione: Apertura
    elementi:
      - musica: 8
      - M: "Oggi è {giorno}, {liturgia}."
      - pausa: 3

  - sezione: Citazione
    se: citazione
    elementi:
      - M: "Una citazione di {citazione_fonte_letta}"
      - F: "{citazione}"
      - musica: 8

  - sezione: Mi preparo
    elementi:
      - M: "Mi preparo."
      - F: |-
          Chiudo gli occhi,
          mi concentro sul momento presente,
          libero la mente da preoccupazioni e pensieri,
          esprimo interiormente il mio desiderio di stare alla presenza del Signore.
      - pausa: 7

  - sezione: Entro nel testo
    se: vangelo
    elementi:
      - M: "Entro nel testo."
      - M: "Ascolta questo passaggio dal Vangelo secondo san {evangelista}."
      - F: "{vangelo}"
      - pausa: 4

  - sezione: Mi lascio ispirare
    se: commento
    elementi:
      - M: "Mi lascio ispirare."
      - F: "{commento}"
        velocita: 0.92
      - pausa: 3

  - sezione: Rifletto sulle domande
    se: domande
    elementi:
      - M: "Rifletto sulle domande."
      - per_ogni_domanda:
          - F: "{domanda}"
            velocita: 0.92
          - pausa: 10

  - sezione: Riascolto il Vangelo
    se: vangelo
    elementi:
      - M: |-
          Nel riascoltare il Vangelo, provo a visualizzare la scena, il luogo in cui avviene, i personaggi principali, le parole che si scambiano, il tono delle voci, i gesti. E lascio affiorare il mio sentire, senza censure, senza giudizi.
          Quale parola o frase cattura la mia attenzione in modo particolare?
      - F: "{vangelo}"
        velocita: 0.92
      - pausa: 3

  - sezione: Ringrazio
    elementi:
      - M: "Ringrazio."
      - F: "Parlo con il Signore come un amico parla con un amico."
      - pausa: 40
      - M: "Concludiamo la nostra preghiera unendoci alla preghiera del Figlio."
      - F: "Padre nostro, che sei nei cieli, sia santificato il tuo nome, venga il tuo regno, sia fatta la tua volontà, come in cielo così in terra. Dacci oggi il nostro pane quotidiano, e rimetti a noi i nostri debiti come anche noi li rimettiamo ai nostri debitori, e non abbandonarci alla tentazione, ma liberaci dal male. Amen."
        velocita: 0.92

  - sezione: Chiusura
    elementi:
      - musica: 8
